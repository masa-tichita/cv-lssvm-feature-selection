[project]
name = "cv-lssvm-feature-selection"
version = "1.0.0"
description = "Cross-validated feature selection using least-squares support vector machines (experiment code)"
authors = [{ name = "Masaharu Mori" }]
license = { file = "LICENSE" }
requires-python = ">=3.13"
# Versions are pinned to the environment used for the experiments in the paper.
dependencies = [
    "fire==0.7.1",
    "gurobipy==12.0.3",
    "joblib==1.5.2",
    "loguru==0.7.3",
    "matplotlib==3.10.6",
    "numpy==2.3.3",
    "pandas==2.3.3",
    "pydantic==2.11.9",
    "pydantic-settings==2.11.0",
    "pyyaml==6.0.3",
    "scikit-learn==1.7.2",
]

[dependency-groups]
dev = ["poethepoet==0.37.0"]

[tool.uv]
# Run as scripts (`uv run poe <task> ...`); the project is not installed as a package.
package = false
# Transitive dependencies pinned to the experiment environment.
constraint-dependencies = [
    "annotated-types==0.7.0",
    "contourpy==1.3.3",
    "fonttools==4.60.1",
    "kiwisolver==1.4.9",
    "packaging==25.0",
    "pillow==11.3.0",
    "pyparsing==3.2.5",
    "python-dotenv==1.1.1",
    "pytz==2025.2",
    "scipy==1.16.2",
    "termcolor==3.1.0",
    "threadpoolctl==3.6.0",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.1",
    "tzdata==2025.2",
]

# Task runner (poethepoet): `uv run poe <task> [args...]`; extra arguments are appended.
[tool.poe]
# Run tasks in the project environment managed by uv, even when poe is installed globally.
executor.type = "uv"

[tool.poe.tasks.run]
help = "Run all methods of one experimental condition (--config configs/<condition>.yml)"
cmd = "python src/main.py run"

[tool.poe.tasks.refit]
help = "Common L2-SVM refit on the saved feature subsets of a result directory"
cmd = "python src/main.py refit"

[tool.poe.tasks.figures]
help = "AUC / F1 / subset-size panels for each SNR of a result directory"
cmd = "python src/main.py figures"

[tool.poe.tasks.table]
help = "Computation-time table from the result directories of the conditions"
cmd = "python src/main.py table"
